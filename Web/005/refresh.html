<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清除缓存 - 原水小子收藏馆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 50px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .info {
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .loading-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
        }
        .loading-progress {
            width: 0%;
            height: 100%;
            background: #ffd700;
            animation: loading 1.5s ease-in-out;
        }
        @keyframes loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 0.85rem;
            min-height: 60px;
        }
        .success { color: #4ade80; }
        .loading { color: #fbbf24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 清除缓存工具</h1>
        <div class="info">
            <p>正在清除缓存，请稍候...</p>
            <p style="margin-top: 10px; font-size: 0.8rem; opacity: 0.8;">
                将自动跳转到主页
            </p>
        </div>
        <div class="status" id="status">初始化中...</div>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('status');

        function updateStatus(message, type = 'loading') {
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
        }

        // 页面加载时自动清除并跳转
        window.addEventListener('load', function() {
            console.log('开始自动清除缓存...');

            // 清除 localStorage
            localStorage.clear();
            updateStatus('✓ LocalStorage 已清除', 'success');

            // 清除 sessionStorage
            sessionStorage.clear();
            updateStatus('✓ SessionStorage 已清除', 'success');

            // 清除 Service Worker 缓存
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    const deletePromises = names.map(name => {
                        return caches.delete(name);
                    });
                    return Promise.all(deletePromises);
                }).then(function() {
                    updateStatus('✓ 所有缓存已清除！正在跳转...', 'success');
                    // 延迟 1.5 秒后跳转
                    setTimeout(() => {
                        const timestamp = new Date().getTime();
                        window.location.href = 'index.html?t=' + timestamp;
                    }, 1500);
                }).catch(function(error) {
                    console.log('缓存清除出错:', error);
                    updateStatus('缓存清除完成，正在跳转...', 'success');
                    setTimeout(() => {
                        const timestamp = new Date().getTime();
                        window.location.href = 'index.html?t=' + timestamp;
                    }, 1000);
                });
            } else {
                // 不支持缓存 API，直接跳转
                updateStatus('✓ 缓存已清除！正在跳转...', 'success');
                setTimeout(() => {
                    const timestamp = new Date().getTime();
                    window.location.href = 'index.html?t=' + timestamp;
                }, 1000);
            }
        });
    </script>
</body>
</html>
