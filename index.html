<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼠鼠主页</title>
    <!-- 缓存控制 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #333;
            font-size: 3em;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        p {
            color: #666;
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        a {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .refresh-link {
            font-size: 0.8rem;
            color: #999;
            margin-top: 20px;
            text-decoration: underline;
            cursor: pointer;
        }
        .refresh-link:hover {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>鼠鼠主页</h1>
        <p>欢迎来到鼠鼠项目主页</p>
        <div class="links">
            <a href="Web/005/refresh.html">原水小子</a>
            <a href="Web/007">jx宝宝</a>
            <a href="Web/008">gjy宝宝</a>
        </div>
        <p class="refresh-link" onclick="clearCache()">清除缓存</p>
    </div>

    <script>
        // 缓存控制
        (function() {
            const CACHE_VERSION = '2025-01-08-v1';
            const currentVersion = localStorage.getItem('homeCacheVersion');
            
            // 检查版本并清除缓存
            if (currentVersion !== CACHE_VERSION) {
                localStorage.clear();
                sessionStorage.clear();
                
                if ('caches' in window) {
                    caches.keys().then(function(names) {
                        return Promise.all(names.map(name => caches.delete(name)));
                    });
                }
                
                localStorage.setItem('homeCacheVersion', CACHE_VERSION);
                console.log('主页缓存已清除，版本:', CACHE_VERSION);
            }
        })();

        // 手动清除缓存函数
        function clearCache() {
            localStorage.clear();
            sessionStorage.clear();
            
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    return Promise.all(names.map(name => caches.delete(name)));
                }).then(() => {
                    alert('缓存已清除！');
                    location.reload(true);
                });
            } else {
                alert('缓存已清除！');
                location.reload(true);
            }
        }
    </script>
</body>
</html>
