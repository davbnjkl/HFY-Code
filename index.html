<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小皮皮虾主页</title>
    <!-- 缓存控制 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ffe6fa 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* 漂浮的小图案 */
        .floating-emoji {
            position: absolute;
            font-size: 2rem;
            opacity: 0.45;
            animation: float 12s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .emoji-1 { top: 10%; left: 10%; animation-delay: 0s; }
        .emoji-2 { top: 20%; right: 15%; animation-delay: 1s; font-size: 2.5rem; }
        .emoji-3 { bottom: 15%; left: 20%; animation-delay: 2s; }
        .emoji-4 { bottom: 25%; right: 10%; animation-delay: 3s; font-size: 1.8rem; }
        .emoji-5 { top: 40%; left: 5%; animation-delay: 4s; font-size: 1.5rem; }

        .container {
            background: rgba(255, 255, 255, 0.72);
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 15;
            animation: fadeInLeft 0.8s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.55);
            max-height: 85vh;
            overflow-y: auto;
            /* 隐藏滚动条 */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        /* 主容器包裹层 */
        .main-wrapper {
            display: flex;
            gap: 200px;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .container::-webkit-scrollbar {
            display: none;
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .logo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
            border: 4px solid rgba(255, 255, 255, 0.8);
            transition: opacity 0.3s ease;
        }

        /* 空状态提示 */
        .subtitle {
            font-size: 1.5rem;
            color: #fff;
            font-weight: 600;
            margin-bottom: 25px;
            padding: 15px 25px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 50%, #ffffff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 2px;
            text-shadow: none;
            border-radius: 15px;
            position: relative;
            display: inline-block;
            white-space: nowrap;
        }

        /* 副标题毛玻璃背景 */
        .subtitle-wrapper {
            display: inline-block;
            position: relative;
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.74);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow: 0 8px 24px rgba(216, 27, 96, 0.08);
        }

        .empty-tip {
            color: #888;
            font-size: 0.9rem;
            padding: 20px;
            display: none;
        }

        /* 中间大标题容器 */
        .title-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            text-align: center;
            animation: fadeInScale 1s ease-out;
            pointer-events: none;
        }

        #titleCanvas {
            pointer-events: none;
        }

        /* 扩大交互区域覆盖整个页面 */
        .interaction-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        #titleCanvas {
            cursor: default;
            display: block;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 30px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
            /* 隐藏滚动条 */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .links::-webkit-scrollbar {
            display: none;
        }

        /* 图片卡片样式 */
        .card-images {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card-image {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            object-fit: cover;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .card-image:hover {
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            z-index: 5;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 30px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.3);
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .link-item:hover::before {
            left: 100%;
        }

        .link-item:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 8px 25px rgba(255, 154, 158, 0.5);
        }

        .link-item:nth-child(1) {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
        }

        .link-item:nth-child(2) {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .link-item:nth-child(3) {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
        }

        .link-item:nth-child(4) {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        }

        .link-item:nth-child(5) {
            background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%);
        }

        .link-item:nth-child(6) {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
        }

        .link-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .links-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }

        .external-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .external-link:hover {
            transform: translateY(-3px) scale(1.05);
            background: rgba(255, 255, 255, 0.35);
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.2);
        }

        .external-link .link-icon {
            font-size: 1.2rem;
        }

        /* 装饰性星星 */
        .star {
            position: absolute;
            color: #ffd700;
            font-size: 1.2rem;
            opacity: 0.68;
        }

        .star-1 { top: 15%; left: 25%; animation-delay: 0s; }
        .star-2 { top: 30%; right: 20%; animation-delay: 0.5s; font-size: 1rem; }
        .star-3 { bottom: 35%; left: 15%; animation-delay: 1s; font-size: 0.8rem; }
        .star-4 { bottom: 20%; right: 25%; animation-delay: 1.5s; }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .container {
                padding: 35px 25px;
                max-height: 90vh;
            }

            h1 {
                font-size: 2.2em;
            }

            .logo {
                width: 120px;
                height: 120px;
            }

            .card-image {
                width: 60px;
                height: 60px;
            }

            .link-item {
                padding: 14px 25px;
                font-size: 1rem;
            }

            .links {
                max-height: 300px;
            }
        }

        /* 空状态提示 */
        .subtitle {
            font-size: 1.5rem;
            color: #fff;
            font-weight: 600;
            margin-bottom: 25px;
            padding: 15px 25px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 50%, #ffffff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 2px;
            text-shadow: none;
            border-radius: 15px;
            position: relative;
            display: inline-block;
            white-space: nowrap;
        }

        /* 副标题毛玻璃背景 */
        .subtitle-wrapper {
            display: inline-block;
            position: relative;
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.78);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow: 0 8px 24px rgba(255, 107, 157, 0.1);
        }

        .empty-tip {
            color: #888;
            font-size: 0.9rem;
            padding: 20px;
            display: none;
        }

        /* 右侧信息面板 */
        .info-panel {
             background: rgba(255, 255, 255, 0.72);
            border-radius: 30px;
            padding: 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 15;
            animation: fadeInRight 0.8s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.55);
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 85vh;
            overflow-y: auto;
            /* 隐藏滚动条 */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .info-top {
            padding: 20px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .info-bottom {
            padding: 20px 15px;
        }

        .info-panel::-webkit-scrollbar {
            display: none;
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .time-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin: 10px 0;
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 3px;
        }

        .date-display {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 15px;
            font-family: 'ZCOOL XiaoWei', serif;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .location-section {
            padding: 15px 20px;
            border-radius: 20px;
        }

        .location-text {
            font-size: 1.8rem;
            color: #fff;
            font-weight: 600;
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .location-decoration {
            display: none;
        }

        .intro-section {
            text-align: left;
        }

        .intro-title {
            font-size: 1.3rem;
            color: #fff;
            font-weight: 600;
            margin-bottom: 15px;
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .intro-content {
            font-size: 1rem;
            color: #fff;
            line-height: 1.8;
            font-family: 'ZCOOL XiaoWei', serif;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .intro-content p {
            margin-bottom: 12px;
        }

        /* 哲理台词切换区域 */
        .quotes-section {
            margin-top: 20px;
            padding: 15px;
            background: transparent;
            border-radius: 15px;
        }

        .quote-item {
            padding: 20px;
             background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 1.2rem;
            color: #fff;
            line-height: 1.8;
            font-family: 'ZCOOL XiaoWei', serif;
            border-left: 4px solid rgba(255, 255, 255, 0.6);
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: justify;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        .quote-item.fade-out {
            opacity: 0;
            transform: translateY(-10px);
        }

        .quote-item.fade-in {
            opacity: 0;
            transform: translateY(10px);
        }

        .quote-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .quote-item .quote-text {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .quote-item .quote-text {
            font-style: italic;
            margin-bottom: 10px;
        }

        .quote-item .quote-source {
            font-size: 1rem;
            color: #fff;
            text-align: right;
            font-weight: 600;
            opacity: 0.9;
        }

        /* 欢迎信息样式 */
        .welcome-message {
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 1.2rem;
            color: #fff;
            line-height: 1.8;
            font-family: 'ZCOOL XiaoWei', serif;
            border-left: 4px solid rgba(255, 255, 255, 0.6);
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        .welcome-message.fade-out {
            opacity: 0;
            transform: translateY(-10px);
        }

        .welcome-message.fade-in {
            opacity: 0;
            transform: translateY(10px);
        }

        .welcome-message.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            body {
                flex-direction: column;
                gap: 25px;
                align-items: center;
                padding: 25px 20px;
            }

            .main-wrapper {
                flex-direction: column;
                gap: 25px;

                width: 100%;
            }

            .title-container {
                position: relative;

            }

            @keyframes fadeInScale {

            }

            .container {

            }

            .info-panel {

            }

            }

            .time-display {

            }

            .date-display {

            }

            .location-text {
                font-size: 1.4rem;
            }

            .intro-title {
                font-size: 1.2rem;
            }

            .intro-content {
                font-size: 1rem;
            }

            }

                padding: 16px;

            }

            }
        }

            }

    <script>
        // 动态艺术字效果
        class ParticleText {
            constructor(canvasId, text, fontSize) {
                this.canvas = document.getElementById(canvasId);
                if (!this.canvas) return;
                this.ctx = this.canvas.getContext('2d', { alpha: true, desynchronized: true });
                this.text = text;
                this.fontSize = fontSize || 150;
                this.particles = [];
                this.ripples = [];
                this.raindrops = [];
                this.dotCache = new Map();
                this.scale = 1;
                this.logicalWidth = 0;
                this.logicalHeight = 0;
                this.textBounds = null;
                this.lastFrameTime = performance.now();
                this.nextDropIn = 0;
                this.animationFrame = null;

                this.init();
                this.bindEvents();
            }

            init() {
                this.resize();
                this.createParticles();
                this.animate();
            }

            resize() {
                const scale = Math.min(window.devicePixelRatio || 1, 1.35);
                const width = Math.min(window.innerWidth * 0.7, 700);
                const height = Math.min(window.innerHeight * 0.5, 350);
                this.scale = scale;
                this.logicalWidth = Math.round(width);
                this.logicalHeight = Math.round(height);
                this.canvas.width = width * scale;
                this.canvas.height = height * scale;
                this.canvas.style.width = width + 'px';
                this.canvas.style.height = height + 'px';
                this.ctx.setTransform(scale, 0, 0, scale, 0, 0);
                this.ctx.imageSmoothingEnabled = true;
            }

            createParticles() {
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = this.logicalWidth;
                tempCanvas.height = this.logicalHeight;

                const fontSize = Math.min(this.fontSize, tempCanvas.width / this.text.length * 2.5);
                tempCtx.font = `${fontSize}px "Ma Shan Zheng", cursive`;
                tempCtx.fillStyle = '#ffffff';
                tempCtx.textAlign = 'center';
                tempCtx.textBaseline = 'middle';
                tempCtx.fillText(this.text, tempCanvas.width / 2, tempCanvas.height / 2);

                const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const pixels = imageData.data;

                this.particles = [];
                this.ripples = [];
                this.raindrops = [];
                this.dotCache.clear();
                const gap = tempCanvas.width < 520 ? 3.1 : 2.6;
                let minX = Infinity;
                let minY = Infinity;
                let maxX = -Infinity;
                let maxY = -Infinity;

                for (let y = 0; y < tempCanvas.height; y += gap) {
                    for (let x = 0; x < tempCanvas.width; x += gap) {
                        const index = (Math.floor(y) * tempCanvas.width + Math.floor(x)) * 4;
                        const alpha = pixels[index + 3];

                        if (alpha > 60) {
                            const particleAlpha = Math.random() * 0.25 + 0.72;
                            const size = Math.random() * 1 + 0.85;
                            this.particles.push({
                                x,
                                y,
                                originX: x,
                                originY: y,
                                size,
                                alpha: particleAlpha,
                                sprite: this.getParticleSprite(size, particleAlpha),
                                vx: 0,
                                vy: 0,
                                phase: Math.random() * Math.PI * 2,
                                driftSpeed: Math.random() * 0.02 + 0.01
                            });

                            if (x < minX) minX = x;
                            if (y < minY) minY = y;
                            if (x > maxX) maxX = x;
                            if (y > maxY) maxY = y;
                        }
                    }
                }

                if (this.particles.length > 0) {
                    this.textBounds = {
                        minX,
                        minY,
                        maxX,
                        maxY,
                        width: maxX - minX,
                        height: maxY - minY
                    };
                } else {
                    this.textBounds = {
                        minX: this.logicalWidth * 0.25,
                        minY: this.logicalHeight * 0.3,
                        maxX: this.logicalWidth * 0.75,
                        maxY: this.logicalHeight * 0.7,
                        width: this.logicalWidth * 0.5,
                        height: this.logicalHeight * 0.4
                    };
                }

                this.resetRainClock();
            }

            getParticleSprite(size, alpha) {
                const key = `${size.toFixed(2)}-${alpha.toFixed(2)}`;
                if (this.dotCache.has(key)) {
                    return this.dotCache.get(key);
                }

                const padding = Math.ceil(size * 2.5);
                const diameter = Math.ceil(size * 2 + padding * 2);
                const spriteCanvas = document.createElement('canvas');
                const spriteCtx = spriteCanvas.getContext('2d');
                const center = diameter / 2;

                spriteCanvas.width = diameter;
                spriteCanvas.height = diameter;

                const glow = spriteCtx.createRadialGradient(center, center, size * 0.2, center, center, size + padding * 0.7);
                glow.addColorStop(0, `rgba(255, 255, 255, ${Math.min(alpha + 0.2, 1)})`);
                glow.addColorStop(1, 'rgba(255, 255, 255, 0)');

                spriteCtx.fillStyle = glow;
                spriteCtx.beginPath();
                spriteCtx.arc(center, center, size + padding * 0.75, 0, Math.PI * 2);
                spriteCtx.fill();

                spriteCtx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                spriteCtx.beginPath();
                spriteCtx.arc(center, center, size, 0, Math.PI * 2);
                spriteCtx.fill();

                const sprite = {
                    canvas: spriteCanvas,
                    offset: center
                };
                this.dotCache.set(key, sprite);
                return sprite;
            }

            bindEvents() {
                this.handleResize = () => {
                    this.resize();
                    this.createParticles();
                };

                window.addEventListener('resize', this.handleResize, { passive: true });
            }

            resetRainClock() {
                this.nextDropIn = 180 + Math.random() * 260;
            }

            spawnRainDrop() {
                if (!this.textBounds) {
                    return;
                }

                const horizontalPadding = 54;
                const verticalPadding = 26;
                const startX = Math.max(12, this.textBounds.minX - horizontalPadding);
                const endX = Math.min(this.logicalWidth - 12, this.textBounds.maxX + horizontalPadding);
                const impactTop = Math.max(20, this.textBounds.minY - verticalPadding);
                const impactBottom = Math.min(this.logicalHeight - 20, this.textBounds.maxY + verticalPadding);
                const x = startX + Math.random() * Math.max(1, endX - startX);
                const targetY = impactTop + Math.random() * Math.max(1, impactBottom - impactTop);
                const fullTextCoverage = Math.min(
                    this.logicalWidth * 0.92,
                    Math.max(this.textBounds.width + 90, this.textBounds.height * 2.4, 190)
                );

                this.raindrops.push({
                    x,
                    y: -38 - Math.random() * 120,
                    targetY,
                    speed: 9 + Math.random() * 3.8,
                    length: 30 + Math.random() * 20,
                    width: 2 + Math.random() * 1.2,
                    alpha: 0.2 + Math.random() * 0.12,
                    splashStrength: 5.5 + Math.random() * 2.5,
                    splashRadius: fullTextCoverage
                });

                if (this.raindrops.length > 5) {
                    this.raindrops.splice(0, this.raindrops.length - 5);
                }
            }

            pushRipple(x, y, strength, radius, life = 24 + Math.random() * 6) {
                this.ripples.push({
                    x,
                    y,
                    strength,
                    radius,
                    age: 0,
                    life
                });

                if (this.ripples.length > 4) {
                    this.ripples.splice(0, this.ripples.length - 4);
                }
            }

            updateRipples(frameFactor) {
                for (let i = this.ripples.length - 1; i >= 0; i -= 1) {
                    this.ripples[i].age += frameFactor;
                    if (this.ripples[i].age >= this.ripples[i].life) {
                        this.ripples.splice(i, 1);
                    }
                }
            }

            updateRain(frameFactor, deltaMs) {
                this.nextDropIn -= deltaMs;
                while (this.nextDropIn <= 0) {
                    this.spawnRainDrop();
                    this.nextDropIn += 240 + Math.random() * 320;
                    if (Math.random() > 0.84) {
                        this.nextDropIn -= 60 + Math.random() * 80;
                    }
                }

                for (let i = this.raindrops.length - 1; i >= 0; i -= 1) {
                    const drop = this.raindrops[i];
                    drop.y += drop.speed * frameFactor;

                    if (drop.y >= drop.targetY) {
                        this.pushRipple(drop.x, drop.targetY, drop.splashStrength, drop.splashRadius);
                        this.raindrops.splice(i, 1);
                    }
                }
            }

            drawRain() {
                if (this.raindrops.length === 0) {
                    return;
                }

                this.ctx.save();
                this.ctx.lineCap = 'round';

                for (let i = 0; i < this.raindrops.length; i += 1) {
                    const drop = this.raindrops[i];
                    this.ctx.beginPath();
                    this.ctx.moveTo(drop.x, drop.y - drop.length);
                    this.ctx.lineTo(drop.x, drop.y);
                    this.ctx.strokeStyle = `rgba(255, 255, 255, ${drop.alpha})`;
                    this.ctx.lineWidth = drop.width;
                    this.ctx.stroke();
                }

                this.ctx.restore();
            }

            animate(now = performance.now()) {
                const deltaMs = Math.min(34, now - this.lastFrameTime || 16.7);
                const frameFactor = deltaMs / 16.7;
                this.lastFrameTime = now;

                this.updateRain(frameFactor, deltaMs);
                this.updateRipples(frameFactor);
                this.ctx.clearRect(0, 0, this.logicalWidth, this.logicalHeight);
                this.drawRain();

                for (let i = 0; i < this.particles.length; i += 1) {
                    const p = this.particles[i];
                    let offsetX = 0;
                    let offsetY = 0;

                    for (let j = 0; j < this.ripples.length; j += 1) {
                        const ripple = this.ripples[j];
                        const dx = p.originX - ripple.x;
                        const dy = p.originY - ripple.y;
                        const distanceSq = dx * dx + dy * dy;
                        const range = ripple.radius + ripple.age * 2.8;

                        if (distanceSq >= range * range) {
                            continue;
                        }

                        const distance = Math.sqrt(distanceSq) || 0.001;
                        const falloff = 1 - distance / range;
                        const decay = 1 - ripple.age / ripple.life;
                        const force = falloff * falloff * ripple.strength * decay;
                        offsetX += (dx / distance) * force;
                        offsetY += (dy / distance) * force;
                    }

                    const targetX = p.originX + offsetX;
                    const targetY = p.originY + offsetY;
                    p.vx += (targetX - p.x) * 0.072 * frameFactor;
                    p.vy += (targetY - p.y) * 0.072 * frameFactor;

                    const damping = Math.pow(0.81, frameFactor);
                    p.vx *= damping;
                    p.vy *= damping;
                    p.x += p.vx;
                    p.y += p.vy;

                    p.phase += p.driftSpeed * frameFactor;
                    const driftX = Math.sin(p.phase) * 0.18;
                    const driftY = Math.cos(p.phase * 0.92) * 0.18;
                    const drawX = p.x + driftX;
                    const drawY = p.y + driftY;

                    this.ctx.drawImage(
                        p.sprite.canvas,
                        drawX - p.sprite.offset,
                        drawY - p.sprite.offset
                    );
                }

                this.animationFrame = requestAnimationFrame((nextFrame) => this.animate(nextFrame));
            }

            changeText(newText) {
                this.text = newText;
                this.createParticles();
            }
        }

            { text: "真正的敌人不是别人，而是自己的软弱。", source: "《怪物猎人》" },
            { text: "没有什么是永恒的，但记忆会永远存在。", source: "《最终幻想》" },
            { text: "即使世界毁灭，也要守护自己珍视的东西。", source: "《尼尔：机械纪元》" },
            { text: "真正的自由不是随心所欲，而是内心的平静。", source: "《刺客信条》" },
            { text: "每个人都有自己的故事，不要轻易评判他人。", source: "《巫师3》" },
            { text: "逆境中的坚持，才是真正的勇气。", source: "《黑暗之魂》" },
            { text: "爱是最强大的力量，它能够超越一切界限。", source: "《最终幻想》" },
            { text: "时间会流逝，但记忆永远珍贵。", source: "《合金装备》" },
            { text: "每个选择都有代价，重要的是不后悔。", source: "《质量效应》" },
            { text: "真正的和平不是没有战争，而是学会理解与包容。", source: "《合金装备》" },
            { text: "英雄也会迷茫，但依然选择前行。", source: "《战神》" },
            { text: "生命中最珍贵的，往往是那些平凡的时刻。", source: "《最终幻想10》" }
        ];

        let currentQuoteIndex = 0;

        // 显示当前语录
        function showQuote(index) {
            const quoteDisplay = document.getElementById('quoteDisplay');
            const quote = gameQuotes[index];

            // 添加淡出效果
            quoteDisplay.classList.add('fade-out');
            quoteDisplay.classList.remove('visible');

            setTimeout(() => {
                // 在逗号处换行
                const formattedText = quote.text.replace(/，/g, '，\n');
                quoteDisplay.innerHTML = `
                    <div class="quote-text">"${formattedText}"</div>
                    <div class="quote-source">— ${quote.source}</div>
                `;

                // 移除淡出，添加淡入
                quoteDisplay.classList.remove('fade-out');
                quoteDisplay.classList.add('fade-in');

                // 短暂延迟后添加visible类以触发淡入动画
                requestAnimationFrame(() => {
                    quoteDisplay.classList.remove('fade-in');
                    quoteDisplay.classList.add('visible');
                });
            }, 500);
        }

        // 切换到下一句语录
        function nextQuote() {
            currentQuoteIndex = (currentQuoteIndex + 1) % gameQuotes.length;
            showQuote(currentQuoteIndex);
        }
    </script>
