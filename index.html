<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小皮皮虾主页</title>
    <!-- 缓存控制 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ffe6fa 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: background-image 2s ease-in-out;
        }

        /* 漂浮的小图案 */
        .floating-emoji {
            position: absolute;
            font-size: 2rem;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .emoji-1 { top: 10%; left: 10%; animation-delay: 0s; }
        .emoji-2 { top: 20%; right: 15%; animation-delay: 1s; font-size: 2.5rem; }
        .emoji-3 { bottom: 15%; left: 20%; animation-delay: 2s; }
        .emoji-4 { bottom: 25%; right: 10%; animation-delay: 3s; font-size: 1.8rem; }
        .emoji-5 { top: 40%; left: 5%; animation-delay: 4s; font-size: 1.5rem; }

        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 15;
            animation: fadeInLeft 0.8s ease-out;
            border: 2px solid rgba(255, 255, 255, 0.3);
            max-height: 85vh;
            overflow-y: auto;
            /* 隐藏滚动条 */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        /* 主容器包裹层 */
        .main-wrapper {
            display: flex;
            gap: 200px;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .container::-webkit-scrollbar {
            display: none;
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .logo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            animation: bounce 2s ease-in-out infinite, pulse 2s ease-in-out infinite;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
            border: 4px solid rgba(255, 255, 255, 0.8);
            transition: opacity 0.3s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3); }
            50% { box-shadow: 0 15px 40px rgba(255, 107, 157, 0.5); }
        }

        /* 空状态提示 */
        .subtitle {
            font-size: 1.5rem;
            color: #fff;
            font-weight: 600;
            margin-bottom: 25px;
            padding: 15px 25px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 50%, #ffffff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 2px;
            animation: subtitleShimmer 3s ease-in-out infinite;
            text-shadow: none;
            border-radius: 15px;
            position: relative;
            display: inline-block;
            white-space: nowrap;
        }

        /* 副标题毛玻璃背景 */
        .subtitle-wrapper {
            display: inline-block;
            position: relative;
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(216, 27, 96, 0.1);
        }

        @keyframes subtitleShimmer {
            0%, 100% {
                filter: brightness(1) drop-shadow(0 0 5px rgba(216, 27, 96, 0.4));
            }
            50% {
                filter: brightness(1.2) drop-shadow(0 0 15px rgba(216, 27, 96, 0.7));
            }
        }

        .empty-tip {
            color: #888;
            font-size: 0.9rem;
            padding: 20px;
            display: none;
        }

        /* 中间大标题容器 */
        .title-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            text-align: center;
            animation: fadeInScale 1s ease-out;
            pointer-events: none;
        }

        #titleCanvas {
            pointer-events: auto;
        }

        /* 扩大交互区域覆盖整个页面 */
        .interaction-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        #titleCanvas {
            cursor: pointer;
            display: block;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 30px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
            /* 隐藏滚动条 */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .links::-webkit-scrollbar {
            display: none;
        }

        /* 图片卡片样式 */
        .card-images {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card-image {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            object-fit: cover;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .card-image:hover {
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            z-index: 5;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 30px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.3);
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .link-item:hover::before {
            left: 100%;
        }

        .link-item:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 8px 25px rgba(255, 154, 158, 0.5);
        }

        .link-item:nth-child(1) {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
        }

        .link-item:nth-child(2) {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .link-item:nth-child(3) {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
        }

        .link-item:nth-child(4) {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        }

        .link-item:nth-child(5) {
            background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%);
        }

        .link-item:nth-child(6) {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
        }

        .link-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .refresh-link {
            font-size: 0.85rem;
            color: #fff;
            margin-top: 20px;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .refresh-link:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .refresh-link span {
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 装饰性星星 */
        .star {
            position: absolute;
            color: #ffd700;
            font-size: 1.2rem;
            animation: twinkle 1.5s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .star-1 { top: 15%; left: 25%; animation-delay: 0s; }
        .star-2 { top: 30%; right: 20%; animation-delay: 0.5s; font-size: 1rem; }
        .star-3 { bottom: 35%; left: 15%; animation-delay: 1s; font-size: 0.8rem; }
        .star-4 { bottom: 20%; right: 25%; animation-delay: 1.5s; }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .container {
                padding: 35px 25px;
                max-height: 90vh;
            }

            h1 {
                font-size: 2.2em;
            }

            .logo {
                width: 120px;
                height: 120px;
            }

            .card-image {
                width: 60px;
                height: 60px;
            }

            .link-item {
                padding: 14px 25px;
                font-size: 1rem;
            }

            .links {
                max-height: 300px;
            }
        }

        /* 空状态提示 */
        .subtitle {
            font-size: 1.5rem;
            color: #fff;
            font-weight: 600;
            margin-bottom: 25px;
            padding: 15px 25px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 50%, #ffffff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 2px;
            animation: subtitleShimmer 3s ease-in-out infinite;
            text-shadow: none;
            border-radius: 15px;
            position: relative;
            display: inline-block;
            white-space: nowrap;
        }

        /* 副标题毛玻璃背景 */
        .subtitle-wrapper {
            display: inline-block;
            position: relative;
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(255, 107, 157, 0.2);
        }

        @keyframes subtitleShimmer {
            0%, 100% {
                filter: brightness(1) drop-shadow(0 0 5px rgba(216, 27, 96, 0.4));
            }
            50% {
                filter: brightness(1.2) drop-shadow(0 0 15px rgba(216, 27, 96, 0.7));
            }
        }

        .empty-tip {
            color: #888;
            font-size: 0.9rem;
            padding: 20px;
            display: none;
        }

        /* 右侧信息面板 */
        .info-panel {
             background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(3px);
            border-radius: 30px;
            padding: 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 15;
            animation: fadeInRight 0.8s ease-out;
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 85vh;
            overflow-y: auto;
            /* 隐藏滚动条 */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .info-top {
            padding: 20px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .info-bottom {
            padding: 20px 15px;
        }

        .info-panel::-webkit-scrollbar {
            display: none;
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .time-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin: 10px 0;
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 3px;
        }

        .date-display {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 15px;
            font-family: 'ZCOOL XiaoWei', serif;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .location-section {
            padding: 15px 20px;
            border-radius: 20px;
        }

        .location-text {
            font-size: 1.8rem;
            color: #fff;
            font-weight: 600;
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 3px;
            position: relative;
            display: inline-block;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 50%, #ffffff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShimmer 3s ease-in-out infinite;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        @keyframes textShimmer {
            0%, 100% {
                filter: brightness(1) drop-shadow(0 0 5px rgba(233, 30, 99, 0.3));
            }
            50% {
                filter: brightness(1.3) drop-shadow(0 0 15px rgba(233, 30, 99, 0.6));
            }
        }

        .location-decoration {
            display: none;
        }

        .intro-section {
            text-align: left;
        }

        .intro-title {
            font-size: 1.3rem;
            color: #fff;
            font-weight: 600;
            margin-bottom: 15px;
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .intro-content {
            font-size: 1rem;
            color: #fff;
            line-height: 1.8;
            font-family: 'ZCOOL XiaoWei', serif;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .intro-content p {
            margin-bottom: 12px;
        }

        /* 哲理台词切换区域 */
        .quotes-section {
            margin-top: 20px;
            padding: 15px;
            background: transparent;
            border-radius: 15px;
        }

        .quote-item {
            padding: 20px;
             background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 1.2rem;
            color: #fff;
            line-height: 1.8;
            font-family: 'ZCOOL XiaoWei', serif;
            border-left: 4px solid rgba(255, 255, 255, 0.6);
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: justify;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        .quote-item.fade-out {
            opacity: 0;
            transform: translateY(-10px);
        }

        .quote-item.fade-in {
            opacity: 0;
            transform: translateY(10px);
        }

        .quote-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .quote-item .quote-text {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .quote-item .quote-text {
            font-style: italic;
            margin-bottom: 10px;
        }

        .quote-item .quote-source {
            font-size: 1rem;
            color: #fff;
            text-align: right;
            font-weight: 600;
            opacity: 0.9;
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            body {
                flex-direction: column;
                gap: 25px;
                align-items: center;
                padding: 25px 20px;
            }

            .main-wrapper {
                flex-direction: column;
                gap: 25px;
                align-items: center;
                width: 100%;
            }

            .title-container {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                width: 100%;
                max-width: 500px;
                margin-bottom: 10px;
            }

            @keyframes fadeInScale {
                from {
                    opacity: 0;
                    transform: scale(0.8);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            .container {
                max-width: 100%;
                order: 1;
                padding: 30px 25px;
            }

            .info-panel {
                max-width: 100%;
                order: 2;
                padding: 25px 20px;
            }

            .info-top, .info-bottom {
                padding: 15px;
            }

            .time-display {
                font-size: 2.8rem;
                margin: 10px 0;
            }

            .date-display {
                font-size: 1.1rem;
                margin: 5px 0;
            }

            .location-text {
                font-size: 1.4rem;
            }

            .intro-title {
                font-size: 1.2rem;
            }

            .intro-content {
                font-size: 1rem;
            }

            .quotes-section {
                padding: 12px;
                margin-top: 15px;
            }

            .quote-item {
                padding: 16px;
                font-size: 1.1rem;
                min-height: 90px;
            }

            .quote-item .quote-source {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 768px) {

        }

        @media (max-width: 480px) {

                padding: 10px;
                gap: 15px;
            }

            .container {

                max-width: 100%;
                min-height: auto;

            .info-panel {

            }

                padding: 12px 18px;

            }

            .time-display {
                font-size: 2rem;
                margin: 8px 0;
            }

            .date-display {
                font-size: 0.85rem;
                margin-bottom: 10px;
            }

            .location-text {
                font-size: 1.1rem;
                line-height: 1.4;
            }

            .intro-title {
                font-size: 1.05rem;
                margin-bottom: 10px;
            }

            .intro-content {
                font-size: 0.9rem;

            }

            .intro-content p {
                margin-bottom: 10px;
            }

            .refresh-link {
                font-size: 0.8rem;
                margin-top: 12px;
            }

            .floating-emoji {
                font-size: 1.2rem;
            }

            .star {
                font-size: 0.9rem;
            }

                padding: 8px;
                margin-top: 10px;
            }

            .quote-item {
                padding: 12px;
                font-size: 0.9rem;
                min-height: 80px;
                line-height: 1.6;
            }

            .quote-item .quote-source {
                font-size: 0.8rem;
                margin-top: 8px;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 12px 8px;
            }

            .container {
                padding: 20px 15px;
            }

            .info-panel {
                padding: 15px 12px;
            }

            .logo {
                width: 100px;
                height: 100px;
            }

            .subtitle {
                font-size: 1.1rem;
                padding: 8px 15px;
            }

            .card-image {
                width: 55px;
                height: 55px;
            }

            .time-display {
                font-size: 1.5rem;
            }

<body>
    <!-- 漂浮的可爱表情 -->

    <script>
        // 动态艺术字效果
        class ParticleText {
            constructor(canvasId, text, fontSize) {
                this.canvas = document.getElementById(canvasId);
                if (!this.canvas) return;
                this.ctx = this.canvas.getContext('2d');
                this.text = text;
                this.fontSize = fontSize || 150;
                this.particles = [];
                this.mouseX = 0;
                this.mouseY = 0;
                this.isHovering = false;
                this.animationFrame = null;

                this.init();
                this.bindEvents();
                this.bindGlobalMouseEvents();
            }

            init() {
                this.resize();
                this.createParticles();
                this.animate();
            }

            resize() {
                const scale = 2;
                const width = Math.min(window.innerWidth * 0.7, 700);
                const height = Math.min(window.innerHeight * 0.5, 350);
                this.canvas.width = width * scale;
                this.canvas.height = height * scale;
                this.canvas.style.width = width + 'px';
                this.canvas.style.height = height + 'px';
                this.ctx.scale(scale, scale);
            }

            createParticles() {
                const scale = 2;
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = this.canvas.width / scale;
                tempCanvas.height = this.canvas.height / scale;

                const fontSize = Math.min(this.fontSize, tempCanvas.width / this.text.length * 2.5);
                tempCtx.font = `${fontSize}px "Ma Shan Zheng", cursive`;
                tempCtx.fillStyle = '#ffffff';
                tempCtx.textAlign = 'center';
                tempCtx.textBaseline = 'middle';
                tempCtx.fillText(this.text, tempCanvas.width / 2, tempCanvas.height / 2);

                const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const pixels = imageData.data;

                this.particles = [];
                const gap = 1.1 * scale;

                for (let y = 0; y < tempCanvas.height; y += gap / scale) {
                    for (let x = 0; x < tempCanvas.width; x += gap / scale) {
                        const index = (Math.floor(y) * tempCanvas.width + Math.floor(x)) * 4;
                        const alpha = pixels[index + 3];

                        if (alpha > 60) {
                            this.particles.push({
                                x: x,
                                y: y,
                                originX: x,
                                originY: y,
                                color: `rgba(${255}, ${255}, ${255}, ${Math.random() * 0.3 + 0.7})`,
                                size: Math.random() * 1.2 + 0.8,
                                vx: 0,
                                vy: 0,
                                angle: Math.random() * Math.PI * 2,
                                speed: Math.random() * 2 + 1
                            });
                        }
                    }
                }
            }

            bindEvents() {
                this.canvas.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.mouseX = e.clientX - rect.left;
                    this.mouseY = e.clientY - rect.top;
                    this.isHovering = true;
                });

                this.canvas.addEventListener('mouseleave', () => {
                    this.isHovering = false;
                });

                this.canvas.addEventListener('click', () => {
                    this.explode();
                });

                window.addEventListener('resize', () => {
                    this.resize();
                    this.createParticles();
                });
            }

            bindGlobalMouseEvents() {
                document.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.mouseX = e.clientX - rect.left;
                    this.mouseY = e.clientY - rect.top;
                    this.isHovering = true;
                });
            }

            explode() {
                this.particles.forEach(p => {
                    const angle = Math.random() * Math.PI * 2;
                    const force = Math.random() * 10 + 5;
                    p.vx = Math.cos(angle) * force;
                    p.vy = Math.sin(angle) * force;
                });
            }

            animate() {
                const scale = 2;
                this.ctx.clearRect(0, 0, this.canvas.width / scale, this.canvas.height / scale);

                this.particles.forEach(p => {
                    let targetX = p.originX;
                    let targetY = p.originY;

                    if (this.isHovering) {
                        const dx = p.x - this.mouseX;
                        const dy = p.y - this.mouseY;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        const maxDistance = 80;

                        if (distance < maxDistance) {
                            const angle = Math.atan2(dy, dx);
                            const force = (maxDistance - distance) / maxDistance;
                            targetX = p.originX + Math.cos(angle) * force * 60;
                            targetY = p.originY + Math.sin(angle) * force * 60;
                        }
                    }

                    p.x += (targetX - p.x) * 0.1;
                    p.y += (targetY - p.y) * 0.1;

                    p.x += Math.sin(p.angle) * 0.15;
                    p.y += Math.cos(p.angle) * 0.15;
                    p.angle += 0.01;

                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = p.color;
                    this.ctx.fill();
                });

                this.animationFrame = requestAnimationFrame(() => this.animate());
            }

            changeText(newText) {
                this.text = newText;
                this.createParticles();
            }
        }

        // 初始化大标题

            if (buttonConfig.length === 0) {
                emptyTip.style.display = 'block';

            buttonConfig.forEach((button, index) => {

                link.href = button.href;

                    <span>${button.text}</span>

                linksContainer.appendChild(link);

        }
        // 缓存控制
        (function() {
            const CACHE_VERSION = '2025-01-08-v2';
            const currentVersion = localStorage.getItem('homeCacheVersion');

            // 检查版本并清除缓存
            if (currentVersion !== CACHE_VERSION) {
                localStorage.clear();
                sessionStorage.clear();

                if ('caches' in window) {
                    caches.keys().then(function(names) {
                        return Promise.all(names.map(name => caches.delete(name)));

        // 手动清除缓存函数
        function clearCache() {
            localStorage.clear();

            if ('caches' in window) {
                caches.keys().then(function(names) {
                    return Promise.all(names.map(name => caches.delete(name)));
                }).then(() => {

        // 背景图片轮换

        function changeBackground() {

            };
        }

        // 每30秒切换背景
        setInterval(changeBackground, 30000);

        // 初始化背景
        window.addEventListener('load', () => {

        // 添加更多随机漂浮的emoji
        function createFloatingEmoji() {

            const emoji = document.createElement('div');
            emoji.className = 'floating-emoji';
            emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + '%';

            emoji.style.fontSize = (1.2 + Math.random() * 1.5) + 'rem';
            emoji.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(emoji);
        }

        // 创建几个额外的漂浮emoji
        for (let i = 0; i < 3; i++) {
            createFloatingEmoji();
        }

        // 随机切换logo图片
        function rotateLogo() {
            const logoImages = ['images/1.jpg', 'images/2.jpg', 'images/3.jpg', 'images/4.jpg'];
            let currentIndex = 0;
            const logo = document.getElementById('mainLogo');

            setInterval(() => {
                currentIndex = (currentIndex + 1) % logoImages.length;
                logo.style.opacity = '0';
                setTimeout(() => {
                    logo.src = logoImages[currentIndex];
                    logo.style.opacity = '1';
                }, 300);
            }, 10000);
        }

        // 启动logo轮换
        window.addEventListener('load', rotateLogo);

        // 页面加载完成后生成按钮
        window.addEventListener('load', generateButtons);

        // 更新时间显示
        function updateTime() {
            const now = new Date();
            const timeDisplay = document.getElementById('timeDisplay');
            const dateDisplay = document.getElementById('dateDisplay');

            // 格式化时间
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            timeDisplay.textContent = `${hours}:${minutes}:${seconds}`;

            // 格式化日期
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekday = weekdays[now.getDay()];
            dateDisplay.textContent = `${year}年${month}月${date}日 ${weekday}`;
        }

        // 每秒更新时间
        setInterval(updateTime, 1000);

        const gameQuotes = [

        let currentQuoteIndex = 0;

        // 显示当前语录
        function showQuote(index) {
            const quoteDisplay = document.getElementById('quoteDisplay');
            const quote = gameQuotes[index];

            // 添加淡出效果
            quoteDisplay.classList.add('fade-out');
            quoteDisplay.classList.remove('visible');

            setTimeout(() => {
                // 在逗号处换行
                const formattedText = quote.text.replace(/，/g, '，\n');
                quoteDisplay.innerHTML = `
                    <div class="quote-text">"${formattedText}"</div>
                    <div class="quote-source">— ${quote.source}</div>
                `;

                // 移除淡出，添加淡入
                quoteDisplay.classList.remove('fade-out');
                quoteDisplay.classList.add('fade-in');

                // 短暂延迟后添加visible类以触发淡入动画
                requestAnimationFrame(() => {
                    quoteDisplay.classList.remove('fade-in');
                    quoteDisplay.classList.add('visible');
                });
            }, 500);

        function nextQuote() {

            showQuote(currentQuoteIndex);

        // 页面加载完成后显示第一句语录
        window.addEventListener('load', () => {

            currentQuoteIndex = Math.floor(Math.random() * gameQuotes.length);
