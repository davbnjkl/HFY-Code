<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小皮皮虾主页</title>
    <!-- 缓存控制 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ffe6fa 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            gap: 30px;
        }

        /* 漂浮的小图案 */
        .floating-emoji {
            position: absolute;
            font-size: 2rem;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .emoji-1 { top: 10%; left: 10%; animation-delay: 0s; }
        .emoji-2 { top: 20%; right: 15%; animation-delay: 1s; font-size: 2.5rem; }
        .emoji-3 { bottom: 15%; left: 20%; animation-delay: 2s; }
        .emoji-4 { bottom: 25%; right: 10%; animation-delay: 3s; font-size: 1.8rem; }
        .emoji-5 { top: 40%; left: 5%; animation-delay: 4s; font-size: 1.5rem; }

        .container {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
            animation: fadeInLeft 0.8s ease-out;
            border: 2px solid rgba(255, 255, 255, 0.4);
            max-height: 85vh;
            overflow-y: auto;
            /* 隐藏滚动条 */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .container::-webkit-scrollbar {
            display: none;
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .logo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            animation: bounce 2s ease-in-out infinite, pulse 2s ease-in-out infinite;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
            border: 4px solid rgba(255, 255, 255, 0.8);
            transition: opacity 0.3s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3); }
            50% { box-shadow: 0 15px 40px rgba(255, 107, 157, 0.5); }
        }

        /* 空状态提示 */
        .empty-tip {
            color: #999;
            font-size: 0.9rem;
            padding: 20px;
            display: none;
        }

        /* 中间大标题容器 */
        .title-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            text-align: center;
            animation: fadeInScale 1s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        #titleCanvas {
            cursor: pointer;
            display: block;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 30px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
            /* 隐藏滚动条 */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .links::-webkit-scrollbar {
            display: none;
        }

        /* 图片卡片样式 */
        .card-images {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card-image {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            object-fit: cover;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .card-image:hover {
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            z-index: 5;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 30px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.3);
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .link-item:hover::before {
            left: 100%;
        }

        .link-item:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 8px 25px rgba(255, 154, 158, 0.5);
        }

        .link-item:nth-child(1) {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
        }

        .link-item:nth-child(2) {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .link-item:nth-child(3) {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
        }

        .link-item:nth-child(4) {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        }

        .link-item:nth-child(5) {
            background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%);
        }

        .link-item:nth-child(6) {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
        }

        .link-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .refresh-link {
            font-size: 0.85rem;
            color: #bbb;
            margin-top: 20px;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .refresh-link:hover {
            color: #ff6b9d;
        }

        .refresh-link span {
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 装饰性星星 */
        .star {
            position: absolute;
            color: #ffd700;
            font-size: 1.2rem;
            animation: twinkle 1.5s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .star-1 { top: 15%; left: 25%; animation-delay: 0s; }
        .star-2 { top: 30%; right: 20%; animation-delay: 0.5s; font-size: 1rem; }
        .star-3 { bottom: 35%; left: 15%; animation-delay: 1s; font-size: 0.8rem; }
        .star-4 { bottom: 20%; right: 25%; animation-delay: 1.5s; }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .container {
                padding: 35px 25px;
                max-height: 90vh;
            }

            h1 {
                font-size: 2.2em;
            }

            .logo {
                width: 120px;
                height: 120px;
            }

            .card-image {
                width: 60px;
                height: 60px;
            }

            .link-item {
                padding: 14px 25px;
                font-size: 1rem;
            }

            .links {
                max-height: 300px;
            }
        }

        /* 空状态提示 */
        .empty-tip {
            color: #999;
            font-size: 0.9rem;
            padding: 20px;
            display: none;
        }

        /* 右侧信息面板 */
        .info-panel {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 350px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
            animation: fadeInRight 0.8s ease-out;
            border: 2px solid rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 30px;
            max-height: 85vh;
            overflow-y: auto;
            /* 隐藏滚动条 */
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .info-panel::-webkit-scrollbar {
            display: none;
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .time-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: #ff6b9d;
            text-shadow: 2px 2px 0 rgba(255, 182, 193, 0.3);
            margin: 10px 0;
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 3px;
        }

        .date-display {
            font-size: 1.3rem;
            color: #666;
            margin-bottom: 15px;
            font-family: 'ZCOOL XiaoWei', serif;
        }

        .location-section {
            padding: 15px 20px;
            border-radius: 20px;
        }

        .location-text {
            font-size: 1.8rem;
            color: #ff6b9d;
            font-weight: 600;
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 3px;
            position: relative;
            display: inline-block;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ff6b9d 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShimmer 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 107, 157, 0.3);
        }

        @keyframes textShimmer {
            0%, 100% {
                filter: brightness(1) drop-shadow(0 0 5px rgba(255, 107, 157, 0.3));
            }
            50% {
                filter: brightness(1.3) drop-shadow(0 0 15px rgba(255, 107, 157, 0.6));
            }
        }

        .location-decoration {
            display: none;
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            body {
                flex-direction: column;
                gap: 20px;
            }

            .title-container {
                position: relative;
                top: auto;
                left: auto;
                transform: none;
                width: 100%;
                max-width: 600px;
                margin-bottom: 20px;
            }

            @keyframes fadeInScale {
                from {
                    opacity: 0;
                    transform: scale(0.8);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            .container {
                max-width: 600px;
                order: 2;
            }

            .info-panel {
                max-width: 600px;
                order: 1;
                padding: 30px 40px;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-around;
                gap: 20px;
            }

            .time-display {
                font-size: 2.5rem;
                margin: 0;
            }

            .date-display {
                font-size: 1rem;
                margin: 0;
            }

            .location-display {
                width: 100%;
                margin-top: 10px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .info-panel {
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }

            .time-display {
                font-size: 2rem;
            }

            .date-display {
                font-size: 0.9rem;
            }

            .location-text {
                font-size: 1.4rem;
            }

            .link-item {
                padding: 12px 20px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <!-- 漂浮的可爱表情 -->
    <div class="floating-emoji emoji-1">✨</div>
    <div class="floating-emoji emoji-2">🌸</div>
    <div class="floating-emoji emoji-3">💫</div>
    <div class="floating-emoji emoji-4">🎀</div>
    <div class="floating-emoji emoji-5">💕</div>

    <!-- 闪烁的星星 -->
    <div class="star star-1">⭐</div>
    <div class="star star-2">⭐</div>
    <div class="star star-3">⭐</div>
    <div class="star star-4">⭐</div>

    <!-- 左侧容器 -->
    <div class="container">
        <img src="images/1.jpg" alt="Logo" class="logo" id="mainLogo">

        <p class="subtitle">✨ 欢迎来到小皮皮虾的小天地 ✨</p>

        <!-- 装饰图片 -->
        <div class="card-images">
            <img src="images/2.jpg" alt="图片1" class="card-image">
            <img src="images/3.jpg" alt="图片2" class="card-image">
            <img src="images/4.jpg" alt="图片3" class="card-image">
        </div>

        <!-- 按钮容器（动态生成） -->
        <div class="links"></div>
        <p class="empty-tip">暂无项目按钮</p>

        <p class="refresh-link" onclick="clearCache()">
            <span>🔄</span>
            <span>清除缓存</span>
        </p>
    </div>

    <!-- 中间大标题 -->
    <div class="title-container">
        <canvas id="titleCanvas"></canvas>
    </div>

    <!-- 右侧信息面板 -->
    <div class="info-panel">
        <div class="time-display" id="timeDisplay">00:00:00</div>
        <div class="date-display" id="dateDisplay">2025年1月1日 星期一</div>
        <div class="location-section">
            <div class="location-decoration"></div>
            <div class="location-text">上海市徐汇区</div>
        </div>
    </div>

    <script>
        // 动态艺术字效果
        class ParticleText {
            constructor(canvasId, text, fontSize) {
                this.canvas = document.getElementById(canvasId);
                if (!this.canvas) return;
                this.ctx = this.canvas.getContext('2d');
                this.text = text;
                this.fontSize = fontSize || 100;
                this.particles = [];
                this.mouseX = 0;
                this.mouseY = 0;
                this.isHovering = false;
                this.animationFrame = null;

                this.init();
                this.bindEvents();
            }

            init() {
                this.resize();
                this.createParticles();
                this.animate();
            }

            resize() {
                const scale = 2;
                const width = Math.min(window.innerWidth * 0.7, 700);
                const height = Math.min(window.innerHeight * 0.5, 350);
                this.canvas.width = width * scale;
                this.canvas.height = height * scale;
                this.canvas.style.width = width + 'px';
                this.canvas.style.height = height + 'px';
                this.ctx.scale(scale, scale);
            }

            createParticles() {
                const scale = 2;
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                tempCanvas.width = this.canvas.width / scale;
                tempCanvas.height = this.canvas.height / scale;

                const fontSize = Math.min(this.fontSize, tempCanvas.width / this.text.length * 2.5);
                tempCtx.font = `bold ${fontSize}px "Ma Shan Zheng", cursive`;
                tempCtx.fillStyle = '#ff6b9d';
                tempCtx.textAlign = 'center';
                tempCtx.textBaseline = 'middle';
                tempCtx.fillText(this.text, tempCanvas.width / 2, tempCanvas.height / 2);

                const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const pixels = imageData.data;

                this.particles = [];
                const gap = 1.5 * scale;

                for (let y = 0; y < tempCanvas.height; y += gap / scale) {
                    for (let x = 0; x < tempCanvas.width; x += gap / scale) {
                        const index = (Math.floor(y) * tempCanvas.width + Math.floor(x)) * 4;
                        const alpha = pixels[index + 3];

                        if (alpha > 60) {
                            this.particles.push({
                                x: x,
                                y: y,
                                originX: x,
                                originY: y,
                                color: `rgba(${255}, ${107}, ${157}, ${Math.random() * 0.3 + 0.7})`,
                                size: Math.random() * 2.5 + 1.5,
                                vx: 0,
                                vy: 0,
                                angle: Math.random() * Math.PI * 2,
                                speed: Math.random() * 2 + 1
                            });
                        }
                    }
                }
            }

            bindEvents() {
                this.canvas.addEventListener('mousemove', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.mouseX = e.clientX - rect.left;
                    this.mouseY = e.clientY - rect.top;
                    this.isHovering = true;
                });

                this.canvas.addEventListener('mouseleave', () => {
                    this.isHovering = false;
                });

                this.canvas.addEventListener('click', () => {
                    this.explode();
                });

                window.addEventListener('resize', () => {
                    this.resize();
                    this.createParticles();
                });
            }

            explode() {
                this.particles.forEach(p => {
                    const angle = Math.random() * Math.PI * 2;
                    const force = Math.random() * 10 + 5;
                    p.vx = Math.cos(angle) * force;
                    p.vy = Math.sin(angle) * force;
                });
            }

            animate() {
                const scale = 2;
                this.ctx.clearRect(0, 0, this.canvas.width / scale, this.canvas.height / scale);

                this.particles.forEach(p => {
                    let targetX = p.originX;
                    let targetY = p.originY;

                    if (this.isHovering) {
                        const dx = p.x - this.mouseX;
                        const dy = p.y - this.mouseY;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        const maxDistance = 80;

                        if (distance < maxDistance) {
                            const angle = Math.atan2(dy, dx);
                            const force = (maxDistance - distance) / maxDistance;
                            targetX = p.originX + Math.cos(angle) * force * 60;
                            targetY = p.originY + Math.sin(angle) * force * 60;
                        }
                    }

                    p.x += (targetX - p.x) * 0.1;
                    p.y += (targetY - p.y) * 0.1;

                    p.x += Math.sin(p.angle) * 0.15;
                    p.y += Math.cos(p.angle) * 0.15;
                    p.angle += 0.01;

                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = p.color;
                    this.ctx.fill();
                });

                this.animationFrame = requestAnimationFrame(() => this.animate());
            }

            changeText(newText) {
                this.text = newText;
                this.createParticles();
            }
        }

        // 初始化大标题
        let titleParticleText;
        window.addEventListener('load', () => {
            titleParticleText = new ParticleText('titleCanvas', '小皮皮虾', 100);

            // 每5秒切换文字动画效果
            const texts = ['小皮皮虾', '✨ 欢迎 ✨', '❤️ 你好 ❤️'];
            let currentIndex = 0;

            setInterval(() => {
                currentIndex = (currentIndex + 1) % texts.length;
                if (titleParticleText) {
                    titleParticleText.changeText(texts[currentIndex]);
                }
            }, 5000);
        });
        // 动态生成按钮的配置
        //const buttonConfig = [
           //{ href: 'Web/005/refresh.html', icon: '💝', text: '原水小子' },
           //{ href: 'Web/007', icon: '🌈', text: 'jx宝宝' },
            //{ href: 'Web/008', icon: '🎈', text: 'gjy宝宝' },
           
            
       //];
 // 添加新按钮时，在这里按格式添加即可
 // { href: '新链接', icon: '🎁', text: '新项目' },
        // 动态生成按钮
        function generateButtons() {
            const linksContainer = document.querySelector('.links');
            const emptyTip = document.querySelector('.empty-tip');

            if (buttonConfig.length === 0) {
                emptyTip.style.display = 'block';
                return;
            }

            buttonConfig.forEach((button, index) => {
                const link = document.createElement('a');
                link.href = button.href;
                link.className = 'link-item';
                link.innerHTML = `
                    <span class="link-icon">${button.icon}</span>
                    <span>${button.text}</span>
                `;
                linksContainer.appendChild(link);
            });
        }
        // 缓存控制
        (function() {
            const CACHE_VERSION = '2025-01-08-v2';
            const currentVersion = localStorage.getItem('homeCacheVersion');

            // 检查版本并清除缓存
            if (currentVersion !== CACHE_VERSION) {
                localStorage.clear();
                sessionStorage.clear();

                if ('caches' in window) {
                    caches.keys().then(function(names) {
                        return Promise.all(names.map(name => caches.delete(name)));
                    });
                }

                localStorage.setItem('homeCacheVersion', CACHE_VERSION);
                console.log('主页缓存已清除，版本:', CACHE_VERSION);
            }
        })();

        // 手动清除缓存函数
        function clearCache() {
            localStorage.clear();
            sessionStorage.clear();

            if ('caches' in window) {
                caches.keys().then(function(names) {
                    return Promise.all(names.map(name => caches.delete(name)));
                }).then(() => {
                    alert('✨ 缓存已清除！ ✨');
                    location.reload(true);
                });
            } else {
                alert('✨ 缓存已清除！ ✨');
                location.reload(true);
            }
        }

        // 添加更多随机漂浮的emoji
        function createFloatingEmoji() {
            const emojis = ['🌸', '💫', '✨', '🎀', '💕', '⭐', '🌈', '💝', '🎵', '🦋'];
            const emoji = document.createElement('div');
            emoji.className = 'floating-emoji';
            emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + '%';
            emoji.style.top = Math.random() * 100 + '%';
            emoji.style.fontSize = (1.2 + Math.random() * 1.5) + 'rem';
            emoji.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(emoji);
        }

        // 创建几个额外的漂浮emoji
        for (let i = 0; i < 3; i++) {
            createFloatingEmoji();
        }

        // 随机切换logo图片
        function rotateLogo() {
            const logoImages = ['images/1.jpg', 'images/2.jpg', 'images/3.jpg', 'images/4.jpg'];
            let currentIndex = 0;
            const logo = document.getElementById('mainLogo');

            setInterval(() => {
                currentIndex = (currentIndex + 1) % logoImages.length;
                logo.style.opacity = '0';
                setTimeout(() => {
                    logo.src = logoImages[currentIndex];
                    logo.style.opacity = '1';
                }, 300);
            }, 5000);
        }

        // 启动logo轮换
        window.addEventListener('load', rotateLogo);

        // 页面加载完成后生成按钮
        window.addEventListener('load', generateButtons);

        // 更新时间显示
        function updateTime() {
            const now = new Date();
            const timeDisplay = document.getElementById('timeDisplay');
            const dateDisplay = document.getElementById('dateDisplay');

            // 格式化时间
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            timeDisplay.textContent = `${hours}:${minutes}:${seconds}`;

            // 格式化日期
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekday = weekdays[now.getDay()];
            dateDisplay.textContent = `${year}年${month}月${date}日 ${weekday}`;
        }

        // 每秒更新时间
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
