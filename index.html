<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小皮皮虾主页</title>
    <!-- 缓存控制 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ffe6fa 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* 漂浮的小图案 */
        .floating-emoji {
            position: absolute;
            font-size: 2rem;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        .emoji-1 { top: 10%; left: 10%; animation-delay: 0s; }
        .emoji-2 { top: 20%; right: 15%; animation-delay: 1s; font-size: 2.5rem; }
        .emoji-3 { bottom: 15%; left: 20%; animation-delay: 2s; }
        .emoji-4 { bottom: 25%; right: 10%; animation-delay: 3s; font-size: 1.8rem; }
        .emoji-5 { top: 40%; left: 5%; animation-delay: 4s; font-size: 1.5rem; }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 700px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 10;
            animation: fadeInUp 0.8s ease-out;
            border: 2px solid rgba(255, 255, 255, 0.3);
            max-height: 85vh;
            overflow-y: auto;
        }

        /* 自定义滚动条 */
        .container::-webkit-scrollbar {
            width: 6px;
        }

        .container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border-radius: 3px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            animation: bounce 2s ease-in-out infinite, pulse 2s ease-in-out infinite;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
            border: 4px solid white;
            transition: opacity 0.3s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3); }
            50% { box-shadow: 0 15px 40px rgba(255, 107, 157, 0.5); }
        }

        h1 {
            color: #ff6b9d;
            font-size: 2.8em;
            margin-bottom: 15px;
            font-weight: 700;
            text-shadow: 2px 2px 0 rgba(255, 182, 193, 0.5);
        }

        .subtitle {
            color: #888;
            font-size: 1.1em;
            margin-bottom: 35px;
            font-weight: 500;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 30px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* 滚动链接列表的自定义滚动条 */
        .links::-webkit-scrollbar {
            width: 5px;
        }

        .links::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .links::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border-radius: 3px;
        }

        /* 图片卡片样式 */
        .card-images {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card-image {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            object-fit: cover;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .card-image:hover {
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            z-index: 5;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 30px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.3);
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .link-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .link-item:hover::before {
            left: 100%;
        }

        .link-item:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 8px 25px rgba(255, 154, 158, 0.5);
        }

        .link-item:nth-child(1) {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
        }

        .link-item:nth-child(2) {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .link-item:nth-child(3) {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
        }

        .link-item:nth-child(4) {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        }

        .link-item:nth-child(5) {
            background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%);
        }

        .link-item:nth-child(6) {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
        }

        .link-icon {
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .refresh-link {
            font-size: 0.85rem;
            color: #bbb;
            margin-top: 20px;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .refresh-link:hover {
            color: #ff6b9d;
        }

        .refresh-link span {
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 装饰性星星 */
        .star {
            position: absolute;
            color: #ffd700;
            font-size: 1.2rem;
            animation: twinkle 1.5s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .star-1 { top: 15%; left: 25%; animation-delay: 0s; }
        .star-2 { top: 30%; right: 20%; animation-delay: 0.5s; font-size: 1rem; }
        .star-3 { bottom: 35%; left: 15%; animation-delay: 1s; font-size: 0.8rem; }
        .star-4 { bottom: 20%; right: 25%; animation-delay: 1.5s; }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .container {
                padding: 35px 25px;
                max-height: 90vh;
            }

            h1 {
                font-size: 2.2em;
            }

            .logo {
                width: 120px;
                height: 120px;
            }

            .card-image {
                width: 60px;
                height: 60px;
            }

            .link-item {
                padding: 14px 25px;
                font-size: 1rem;
            }

            .links {
                max-height: 300px;
            }
        }

        /* 空状态提示 */
        .empty-tip {
            color: #999;
            font-size: 0.9rem;
            padding: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- 漂浮的可爱表情 -->
    <div class="floating-emoji emoji-1">✨</div>
    <div class="floating-emoji emoji-2">🌸</div>
    <div class="floating-emoji emoji-3">💫</div>
    <div class="floating-emoji emoji-4">🎀</div>
    <div class="floating-emoji emoji-5">💕</div>

    <!-- 闪烁的星星 -->
    <div class="star star-1">⭐</div>
    <div class="star star-2">⭐</div>
    <div class="star star-3">⭐</div>
    <div class="star star-4">⭐</div>

    <div class="container">
        <img src="images/1.jpg" alt="Logo" class="logo" id="mainLogo">
        <h1>小皮皮虾主页</h1>
        <p class="subtitle">✨ 欢迎来到小皮皮虾的小天地 ✨</p>

        <!-- 装饰图片 -->
        <div class="card-images">
            <img src="images/2.jpg" alt="图片1" class="card-image">
            <img src="images/3.jpg" alt="图片2" class="card-image">
            <img src="images/4.jpg" alt="图片3" class="card-image">
        </div>

        <!-- 按钮容器（动态生成） -->
        <div class="links"></div>
        <p class="empty-tip">暂无项目按钮</p>

        <p class="refresh-link" onclick="clearCache()">
            <span>🔄</span>
            <span>清除缓存</span>
        </p>
    </div>

    <script>
        // 动态生成按钮的配置
        //const buttonConfig = [
          //  { href: 'Web/005/refresh.html', icon: '💝', text: '原水小子' },
         //   { href: 'Web/007', icon: '🌈', text: 'jx宝宝' },
         //   { href: 'Web/008', icon: '🎈', text: 'gjy宝宝' },
            // 添加新按钮时，在这里按格式添加即可
            // { href: '新链接', icon: '🎁', text: '新项目' },
       // ];

        // 动态生成按钮
        function generateButtons() {
            const linksContainer = document.querySelector('.links');
            const emptyTip = document.querySelector('.empty-tip');

            if (buttonConfig.length === 0) {
                emptyTip.style.display = 'block';
                return;
            }

            buttonConfig.forEach((button, index) => {
                const link = document.createElement('a');
                link.href = button.href;
                link.className = 'link-item';
                link.innerHTML = `
                    <span class="link-icon">${button.icon}</span>
                    <span>${button.text}</span>
                `;
                linksContainer.appendChild(link);
            });
        }
        // 缓存控制
        (function() {
            const CACHE_VERSION = '2025-01-08-v2';
            const currentVersion = localStorage.getItem('homeCacheVersion');

            // 检查版本并清除缓存
            if (currentVersion !== CACHE_VERSION) {
                localStorage.clear();
                sessionStorage.clear();

                if ('caches' in window) {
                    caches.keys().then(function(names) {
                        return Promise.all(names.map(name => caches.delete(name)));
                    });
                }

                localStorage.setItem('homeCacheVersion', CACHE_VERSION);
                console.log('主页缓存已清除，版本:', CACHE_VERSION);
            }
        })();

        // 手动清除缓存函数
        function clearCache() {
            localStorage.clear();
            sessionStorage.clear();

            if ('caches' in window) {
                caches.keys().then(function(names) {
                    return Promise.all(names.map(name => caches.delete(name)));
                }).then(() => {
                    alert('✨ 缓存已清除！ ✨');
                    location.reload(true);
                });
            } else {
                alert('✨ 缓存已清除！ ✨');
                location.reload(true);
            }
        }

        // 添加更多随机漂浮的emoji
        function createFloatingEmoji() {
            const emojis = ['🌸', '💫', '✨', '🎀', '💕', '⭐', '🌈', '💝', '🎵', '🦋'];
            const emoji = document.createElement('div');
            emoji.className = 'floating-emoji';
            emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.left = Math.random() * 100 + '%';
            emoji.style.top = Math.random() * 100 + '%';
            emoji.style.fontSize = (1.2 + Math.random() * 1.5) + 'rem';
            emoji.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(emoji);
        }

        // 创建几个额外的漂浮emoji
        for (let i = 0; i < 3; i++) {
            createFloatingEmoji();
        }

        // 随机切换logo图片
        function rotateLogo() {
            const logoImages = ['images/1.jpg', 'images/2.jpg', 'images/3.jpg', 'images/4.jpg'];
            let currentIndex = 0;
            const logo = document.getElementById('mainLogo');

            setInterval(() => {
                currentIndex = (currentIndex + 1) % logoImages.length;
                logo.style.opacity = '0';
                setTimeout(() => {
                    logo.src = logoImages[currentIndex];
                    logo.style.opacity = '1';
                }, 300);
            }, 5000);
        }

        // 启动logo轮换
        window.addEventListener('load', rotateLogo);

        // 页面加载完成后生成按钮
        window.addEventListener('load', generateButtons);
    </script>
</body>
</html>
